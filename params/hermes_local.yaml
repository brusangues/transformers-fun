# Model params — rede INTERMEDIÁRIA p/ RTX 5050 8GB, rodada 30k iters
# Histórico: params 'kaggle' = T4 16GB; antigos locais = 2GB → meio-termo p/ 8GB.
batch_size: 12           # MANTIDO (usuário não quer baixar); pico de logits ~1.23GB
context_len: 512
n_embd: 320              # leve redução (384->320): baixa o teto sem encolher demais
n_feed_forward: 1280     # n_embd*4
n_head: 5                # head_size 64
n_layer: 5               # 6 -> 5
dropout: 0.1

# Optimizer (Attention-is-all-you-need)
grad_accum_steps: 8      # batch efetivo = 12*8 = 96 seq (~49k tokens)
learning_rate: 0.0008
betas: [0.9, 0.98]
eps: 0.000_000_001
weight_decay: 0.01
dynamic_lr: true
warmup_steps: 2000       # para rodada longa

# Loop — RODADA LONGA: 30k steps
start_iter: 0
max_iters: 30000
eval_interval: 200
save_interval: 1000
eval_iters: 50
texts_sample_frac: 1.0
split_frac: 0.85
n_checkpoints_keep: 3
early_stopping: 25       # paciência em nº de evals (2000 iters)

# Geração
top_k: 30
temperature: 0.7

# Paths (LOCAIS)
path_tokenizer: "artifacts/tokenizers/gpt2_ptbr_50k_v2"
path_input: "data/df_full_encoded_v21.pq"
path_models: "models"
name: "hermes_local_mid"
n_tokens_generate: 600
context: "Escrevo sob efeito de horrores inimagináveis."
# dummy: true              # smoke-test (1 batch)