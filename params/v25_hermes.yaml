# Model params — v25-hermes p/ RTX 5050 8GB, rodada 30k steps
# Histórico: params 'kaggle' = T4 16GB; antigos locais = 2GB.
# v25: rede MAIOR (384/6) + batch MENOR (8) p/ caber no 8GB mantendo qualidade.
batch_size: 8            # DIMINUÍDO de 12 p/ caber rede maior (pico de logits ~0.82GB)
context_len: 512
n_embd: 384              # rede maior (era 320)
n_feed_forward: 1536     # n_embd*4
n_head: 6
n_layer: 6               # aprofundada (era 5)
dropout: 0.1

# Optimizer (Attention-is-all-you-need)
grad_accum_steps: 12     # batch efetivo = 8*12 = 96 seq (~49k tokens), igual ao run anterior
learning_rate: 0.0008
betas: [0.9, 0.98]
eps: 0.000_000_001
weight_decay: 0.01
dynamic_lr: true
warmup_steps: 2000       # para rodada longa

# Loop — mesma quantidade de steps da última vez
start_iter: 0
max_iters: 30000
eval_interval: 200
save_interval: 1000
eval_iters: 50
texts_sample_frac: 1.0
split_frac: 0.85
n_checkpoints_keep: 3
early_stopping: 25       # paciência em nº de evals (2000 iters)

# Geração
top_k: 30
temperature: 0.7

# Paths (LOCAIS)
path_tokenizer: "artifacts/tokenizers/gpt2_ptbr_50k_v2"
path_input: "data/df_full_encoded_v21.pq"
path_models: "models"
name: "v25_hermes"
n_tokens_generate: 600
context: "Escrevo sob efeito de horrores inimagináveis."
# dummy: true              # smoke-test (1 batch)