# Model parameters
batch_size: 100  # independent sequences processed in parallel
context_len: 256  # maximum token context length
n_embd: 256  # linear layers size
n_feed_forward: 1536
n_head: 8  # parallel attention heads
n_layer: 4  # attention blocks in sequence
dropout: 0.15

# Training parameters
learning_rate: 0.004
start_iter: 2000
max_iters: 3000
eval_interval: 100
save_interval: 100
eval_iters: 50
texts_sample_frac: 1.0
split_frac: 0.85

# Generation parameters
top_k: 30
temperature: 0.7

# Other parameters
path_input: "data/df_full_encoded_v0.pq"
path_tokenizer: "artifacts/tokenizers/mix_ptbr_4096_v1.joblib"
name: "v14"
path_load_model: "artifacts/checkpoints/mix_v14_1999.pth"
path_save_model: "artifacts/checkpoints/mix_v14"
path_generate_output: "output/mix_v14_2.txt"
n_tokens_generate: 600
context: "Escrevo sob efeito de horrores inimaginaveis"
# context: "Escrevo sabendo que meu fim esta proximo.\nFoi ha um ano atras"

